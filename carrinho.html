.sidebar {
    position: fixed;
    top: 0;
    left: -300px;
    width: 300px;
    height: 100vh;
    background: linear-gradient(180deg, #0a0a0a 0%, #111111 100%);
    backdrop-filter: blur(10px);
    transition: left 0.3s ease;
    z-index: 999;
    border-right: 1px solid rgba(179, 0, 255, 0.3);
    box-shadow: 5px 0 20px rgba(0, 0, 0, 0.5);
}

.sidebar.active {
    left: 0;
}

.sidebar nav {
    display: flex;
    flex-direction: column;
    padding: 80px 20px 20px;
    height: 100%;
    overflow-y: auto;
}

.sidebar a {
    color: rgba(255, 255, 255, 0.8);
    padding: 15px 20px;
    text-decoration: none;
    transition: all 0.3s ease;
    margin: 5px 0;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 12px;
    position: relative;
    overflow: hidden;
}

.sidebar a::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 3px;
    background: linear-gradient(180deg, #b300ff, #9900cc);
    transform: scaleY(0);
    transition: transform 0.3s ease;
}

.sidebar a:hover {
    color: #b300ff;
    background: rgba(179, 0, 255, 0.1);
    transform: translateX(5px);
}

.sidebar a:hover::before {
    transform: scaleY(1);
}

.sidebar a i {
    font-size: 1.1rem;
    width: 20px;
    text-align: center;
}

.close-sidebar {
    position: absolute;
    top: 15px;
    right: 15px;
    color: rgba(255, 255, 255, 0.7);
    font-size: 1.5rem;
    cursor: pointer;
    padding: 8px;
    border-radius: 50%;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
}

.close-sidebar:hover {
    color: #b300ff;
    background: rgba(179, 0, 255, 0.1);
    transform: rotate(90deg);
}

.sidebar-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.5);
    z-index: 998;
    opacity: 0;
    visibility: hidden;
    transition: all 0.3s ease;
}

.sidebar-overlay.active {
    opacity: 1;
    visibility: visible;
}

@media (max-width: 480px) {
    .sidebar {
        width: 280px;
        left: -280px;
    }
    
    .sidebar nav {
        padding: 70px 15px 15px;
    }
    
    .sidebar a {
        padding: 12px 15px;
        font-size: 0.9rem;
    }
}



/* === VELTRIX TOPO PREMIUM === */
:root{
  --veltrix-purple:#b300ff;
  --veltrix-purple2:#7900ff;
  --veltrix-bg:#050007;
}
header{
  min-height:74px !important;
  height:74px !important;
  padding:8px 18px !important;
  background:linear-gradient(90deg, rgba(5,0,8,.98), rgba(23,0,34,.98), rgba(5,0,8,.98)) !important;
  border-bottom:1px solid rgba(179,0,255,.75) !important;
  box-shadow:0 0 24px rgba(179,0,255,.45), inset 0 -1px 0 rgba(255,255,255,.08) !important;
  backdrop-filter:blur(12px) !important;
}
header::before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:radial-gradient(circle at 50% 0%, rgba(179,0,255,.35), transparent 45%);
}
.menu-toggle{
  width:56px !important;
  height:56px !important;
  border-radius:16px !important;
  background:linear-gradient(135deg,#cc00ff,#7900ff) !important;
  color:white !important;
  box-shadow:0 0 18px rgba(179,0,255,.65) !important;
  font-size:1.45rem !important;
}
.logo{
  position:absolute !important;
  left:50% !important;
  top:50% !important;
  transform:translate(-50%,-50%) !important;
  display:flex !important;
  align-items:center !important;
  justify-content:center !important;
  gap:12px !important;
  white-space:nowrap !important;
}
.logo img{
  width:54px !important;
  height:54px !important;
  border-radius:10px !important;
  object-fit:cover !important;
  filter:drop-shadow(0 0 8px #b300ff) drop-shadow(0 0 18px rgba(179,0,255,.85)) !important;
}
.logo-text{
  font-family:'Montserrat', sans-serif !important;
  font-size:1.65rem !important;
  font-weight:900 !important;
  letter-spacing:3px !important;
  text-transform:uppercase !important;
  color:#e9c8ff !important;
  text-shadow:0 0 8px #b300ff, 0 0 18px #b300ff, 0 0 28px #7900ff !important;
}
.logo-text::after{
  content:' STORE';
  font-size:.65rem;
  margin-left:8px;
  letter-spacing:2px;
  color:#ffffff;
  opacity:.85;
}
.cart-icon{
  width:56px !important;
  height:56px !important;
  display:flex !important;
  align-items:center !important;
  justify-content:center !important;
  border-radius:16px !important;
  background:rgba(255,255,255,.09) !important;
  border:1px solid rgba(179,0,255,.35) !important;
  box-shadow:0 0 15px rgba(179,0,255,.35) !important;
  font-size:1.55rem !important;
}
#cart-count{
  top:-5px !important;
  right:-5px !important;
  background:linear-gradient(135deg,#ff0066,#b300ff) !important;
}
.container, main{
  margin-top:88px !important;
}
@media(max-width:480px){
  header{height:68px !important; min-height:68px !important; padding:7px 14px !important;}
  .menu-toggle,.cart-icon{width:50px !important;height:50px !important;border-radius:14px !important;}
  .logo img{width:44px !important;height:44px !important;}
  .logo-text{font-size:1.32rem !important;letter-spacing:2px !important;}
  .logo-text::after{display:none;}
  .container, main{margin-top:82px !important;}
}

.carrinho-container {
    max-width: 900px;
    width: calc(100% - 40px);
    margin: 80px auto 40px;
    background: var(--card-bg);
    padding: 30px;
    border-radius: 12px;
    border: 1px solid var(--border-color);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    position: relative;
}

.carrinho-container h1 {
    text-align: center;
    margin-bottom: 30px;
    color: var(--text-color);
    font-size: 2rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 2px;
    position: relative;
    padding-bottom: 15px;
}

.carrinho-container h1::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 80px;
    height: 3px;
    background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
    border-radius: 2px;
}

.item-carrinho {
    display: flex;
    align-items: center;
    margin-bottom: 20px;
    padding: 20px;
    background: rgba(255, 255, 255, 0.02);
    border-radius: 10px;
    border: 1px solid var(--border-color);
    transition: all 0.3s ease;
}

.item-carrinho:hover {
    transform: translateY(-3px);
    border-color: var(--primary-color);
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
}

.item-carrinho img {
    width: 100px;
    height: 80px;
    object-fit: cover;
    border-radius: 8px;
    margin-right: 20px;
    border: 1px solid var(--border-color);
}

.detalhes-item {
    flex-grow: 1;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.info-produto {
    flex: 1;
}

.nome-produto {
    font-weight: 600;
    color: var(--text-color);
    margin-bottom: 8px;
    font-size: 1.1rem;
}

.preco-produto {
    color: var(--money-color);
    font-weight: 700;
    margin-bottom: 8px;
    text-shadow: 0 0 10px var(--primary-color);
    font-size: 1.1rem;
}

.controles-quantidade {
    display: flex;
    align-items: center;
    gap: 12px;
}

.botao-quantidade {
    background: var(--primary-color);
    color: var(--dark-bg);
    border: none;
    width: 35px;
    height: 35px;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
    font-size: 1.2rem;
    font-weight: 600;
}

.botao-quantidade:hover {
    background: var(--secondary-color);
    transform: scale(1.1);
}

.quantidade {
    width: 50px;
    text-align: center;
    background: var(--dark-bg);
    color: var(--text-color);
    border: 1px solid var(--border-color);
    border-radius: 6px;
    padding: 8px;
    font-weight: 600;
    font-size: 1rem;
}

.botoes-carrinho {
    display: flex;
    justify-content: space-between;
    margin-top: 30px;
    gap: 15px;
}

.botao {
    border: none;
    padding: 15px 25px;
    border-radius: 8px;
    cursor: pointer;
    flex: 1;
    font-weight: 600;
    transition: all 0.3s ease;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font-size: 1rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.botao:hover {
    transform: translateY(-2px);
}

.botao-finalizar {
    background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
    color: var(--dark-bg);
}

.botao-finalizar:hover {
    box-shadow: 0 8px 20px var(--shadow-color);
}

.botao-limpar {
    background: transparent;
    color: var(--accent-color);
    border: 2px solid var(--accent-color);
}

.botao-limpar:hover {
    background: var(--accent-color);
    color: white;
}

.botao-remover {
    background: var(--accent-color);
    color: white;
    border: none;
    padding: 8px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.85rem;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    gap: 5px;
    font-weight: 600;
}

.botao-remover:hover {
    background: #cc0052;
    transform: translateY(-2px);
}

#total-carrinho {
    text-align: right;
    font-size: 1.5rem;
    font-weight: 700;
    margin-top: 25px;
    color: var(--money-color);
    padding-top: 20px;
    border-top: 1px solid var(--border-color);
    text-shadow: 0 0 15px var(--primary-color);
    text-transform: uppercase;
    letter-spacing: 1px;
}

.carrinho-vazio {
    text-align: center;
    padding: 50px 0;
    color: var(--text-secondary);
    font-size: 1.2rem;
}

@media (max-width: 768px) {
    .carrinho-container {
        margin: 70px auto 20px;
        padding: 20px;
    }
    
    .item-carrinho {
        flex-direction: column;
        align-items: flex-start;
        padding: 15px;
    }

    .item-carrinho img {
        width: 100%;
        height: auto;
        max-height: 150px;
        margin-bottom: 15px;
        margin-right: 0;
    }

    .detalhes-item {
        flex-direction: column;
        align-items: flex-start;
        width: 100%;
        gap: 15px;
    }

    .controles-quantidade {
        width: 100%;
        justify-content: space-between;
    }

    .botoes-carrinho {
        flex-direction: column;
    }
}

@media (max-width: 480px) {
    .carrinho-container {
        margin-top: 65px;
        padding: 15px;
    }
    
    .carrinho-container h1 {
        font-size: 1.6rem;
    }
}

<script>
// Assets/JS/Cart.js
class CarrinhoManager {
    constructor() {
        this.carrinho = JSON.parse(localStorage.getItem("carrinho")) || [];
        this.atualizarContadorCarrinho();
    }

adicionarProduto(produto) {
    const regexDuracao = /\(([^)]+)\)/;

    const tituloSemDuracao = produto.titulo.replace(regexDuracao, "").trim().toLowerCase();
    const duracaoExtraida = (regexDuracao.exec(produto.titulo)?.[1] || produto.duracao || "").trim().toLowerCase();

    const produtoExistente = this.carrinho.find(item =>
        item.tituloBase === tituloSemDuracao &&
        item.duracaoBase === duracaoExtraida
    );

    if (produtoExistente) {
        produtoExistente.quantidade += produto.quantidade || 1;
    } else {
        this.carrinho.push({
            ...produto,
            quantidade: produto.quantidade || 1,
            tituloBase: tituloSemDuracao,
            duracaoBase: duracaoExtraida
        });
    }

    this.salvarCarrinho();
    this.atualizarContadorCarrinho();
    this.renderizarCarrinho();
    this.showNotification(`"${produto.titulo}" adicionado ao carrinho!`);
}



    aumentarQuantidade(titulo) {
        
        const produto = this.carrinho.find(item => item.titulo === titulo);
        if (produto) {
            produto.quantidade += 1;
            this.salvarCarrinho();
            this.atualizarContadorCarrinho();
            this.renderizarCarrinho();
            this.showNotification(`Quantidade de "${titulo}" aumentada para ${produto.quantidade}`);
        }
    }

    diminuirQuantidade(titulo) {
        
        const produto = this.carrinho.find(item => item.titulo === titulo);
        if (produto) {
            if (produto.quantidade > 1) {
                produto.quantidade -= 1;
                this.salvarCarrinho();
                this.atualizarContadorCarrinho();
                this.renderizarCarrinho();
                this.showNotification(`Quantidade de "${titulo}" diminuída para ${produto.quantidade}`);
            } else {
                this.removerProdutoCompleto(titulo);
            }
        }
    }

    removerProdutoCompleto(titulo) {
        
        this.carrinho = this.carrinho.filter(item => item.titulo !== titulo);
        this.salvarCarrinho();
        this.atualizarContadorCarrinho();
        this.renderizarCarrinho();
        this.showNotification(`${titulo} removido do carrinho!`);
    }

    limparCarrinho() {
        
        this.carrinho = [];
        this.salvarCarrinho();
        this.atualizarContadorCarrinho();
        this.renderizarCarrinho();
        this.showNotification("Carrinho limpo com sucesso!");
    }

    salvarCarrinho() {
        
        localStorage.setItem("carrinho", JSON.stringify(this.carrinho));
    }

    calcularTotal() {
        
        return this.carrinho.reduce((total, produto) => {
            const precoNumerico = parseFloat(
                produto.preco.replace("R$", "")
                    .replace(/\./g, "")
                    .replace(",", ".")
                    .trim()
            );
            return total + (precoNumerico * produto.quantidade);
        }, 0).toFixed(2);
    }

    atualizarContadorCarrinho() {
        
        const contadorCarrinho = document.getElementById("cart-count");
        if (contadorCarrinho) {
            const totalItens = this.carrinho.reduce((total, produto) => total + produto.quantidade, 0);
            contadorCarrinho.textContent = totalItens;
            contadorCarrinho.style.display = totalItens > 0 ? "flex" : "none";
        }
    }

    renderizarCarrinho() {
        
        const carrinhoContainer = document.getElementById("carrinho-items");
        const totalCarrinho = document.getElementById("total-carrinho");

        if (carrinhoContainer && totalCarrinho) {
            carrinhoContainer.innerHTML = "";

            if (this.carrinho.length === 0) {
                carrinhoContainer.innerHTML = '<div class="carrinho-vazio">Seu carrinho está vazio</div>';
            } else {
                this.carrinho.forEach(produto => {
                    const itemCarrinho = document.createElement("div");
                    itemCarrinho.classList.add("item-carrinho");

                    const precoFormatado = produto.preco.includes("R$") ? produto.preco : `R$ ${produto.preco}`;

                    itemCarrinho.innerHTML = `
                        <img src="${produto.imagem}" alt="${produto.titulo}">
                        <div class="detalhes-item">
                            <div class="info-produto">
                                <div class="nome-produto">${produto.titulo}</div>
                                <div class="preco-produto">${precoFormatado}</div>
                            </div>
                            <div class="controles-quantidade">
                                <button class="botao-quantidade" data-action="diminuir" data-titulo="${produto.titulo}">
                                    <i class="bi bi-dash"></i>
                                </button>
                                <span class="quantidade">${produto.quantidade}</span>
                                <button class="botao-quantidade" data-action="aumentar" data-titulo="${produto.titulo}">
                                    <i class="bi bi-plus"></i>
                                </button>
                                <button class="botao-remover" data-action="remover-completo" data-titulo="${produto.titulo}">
                                    <i class="bi bi-trash"></i> Remover
                                </button>
                            </div>
                        </div>
                    `;
                    carrinhoContainer.appendChild(itemCarrinho);
                });
            }

            const totalNumerico = this.calcularTotal();
            const totalFormatado = `R$ ${parseFloat(totalNumerico).toFixed(2).replace(".", ",")}`;
            totalCarrinho.textContent = `Total: ${totalFormatado}`;
        }
    }

finalizarCompra() {
    if (this.carrinho.length === 0) {
        this.showNotification("Seu carrinho está vazio!");
        return;
    }

    const total = this.calcularTotal();

    const nome = prompt("Digite seu nome:");
    if (!nome) {
        alert("O nome é obrigatório.");
        return;
    }

    const email = prompt("Digite seu e-mail:");
    if (!email) { 
        alert("O e-mail é obrigatório."); 
        return; 
    }

    const regexEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!regexEmail.test(email)) {
        alert("Digite um e-mail válido.");
        return;
    }

    const produtosStr = this.carrinho.map(p => {
        let tituloTratado = p.titulo.replace("💻", "(PC)").replace("📱", "(Mobile)");
        return `${tituloTratado} (${p.quantidade}x)`;
    }).join(", ");

    const mensagem = `Olá, meu nome é ${nome}.`
        + `\n\nEmail: ${email}`
        + `\nProdutos: ${produtosStr}`
        + `\nTotal: ${total}`;

    const url = `https://w.app/veltrix?text=${encodeURIComponent(mensagem)}`;

    window.location.href = url;

    this.limparCarrinho();
}


    showNotification(message) {
        
        const notification = document.getElementById("notification");
        if (notification) {
            notification.textContent = message;
            notification.classList.add("show");

            setTimeout(() => {
                notification.classList.remove("show");
            }, 3000);
        } else {
            
            console.log("Notificação:", message);
        }
    }
}


const carrinhoManager = new CarrinhoManager();

function initEvents() {
    
    document.addEventListener("click", function (e) {
        const target = e.target;

        if (target.matches(".botao-quantidade") || target.closest(".botao-quantidade")) {
            const button = target.closest(".botao-quantidade");
            const action = button.dataset.action;
            const titulo = button.dataset.titulo;

            if (action === "aumentar") {
                carrinhoManager.aumentarQuantidade(titulo);
            } else if (action === "diminuir") {
                carrinhoManager.diminuirQuantidade(titulo);
            }
        }

        if (target.matches(".botao-remover") || target.closest(".botao-remover")) {
            const button = target.closest(".botao-remover");
            const titulo = button.dataset.titulo;
            carrinhoManager.removerProdutoCompleto(titulo);
        }
    });

    
    const btnLimpar = document.getElementById("btn-limpar");
    if (btnLimpar) {
        btnLimpar.addEventListener("click", () => {
            carrinhoManager.limparCarrinho();
        });
    }

    const btnFinalizar = document.getElementById("btn-finalizar");
    if (btnFinalizar) {
        btnFinalizar.addEventListener("click", () => {
            carrinhoManager.finalizarCompra();
        });
    }
}

document.addEventListener("DOMContentLoaded", function () {
    carrinhoManager.renderizarCarrinho();
    initEvents();

    
    function criarParticulas() {
        const particlesContainer = document.getElementById("particles");
        if (!particlesContainer) return;
        
        const particleCount = 30;

        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement("div");
            particle.classList.add("particle");

            const posX = Math.random() * 100;
            const posY = Math.random() * 100;
            particle.style.left = `${posX}%`;
            particle.style.top = `${posY}%`;

            const size = Math.random() * 3 + 1;
            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;

            const opacity = Math.random() * 0.7 + 0.3;
            particle.style.opacity = opacity;

            const duration = Math.random() * 10 + 5;
            particle.style.animation = `float ${duration}s infinite ease-in-out`;

            particlesContainer.appendChild(particle);
        }
    }

    const style = document.createElement("style");
    style.textContent = `
        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            25% { transform: translate(${Math.random() * 20 - 10}px, ${Math.random() * 20 - 10}px); }
            50% { transform: translate(${Math.random() * 20 - 10}px, ${Math.random() * 20 - 10}px); }
            75% { transform: translate(${Math.random() * 20 - 10}px, ${Math.random() * 20 - 10}px); }
        }
        
        .duracao-produto {
            font-size: 0.9em;
            color: #666;
            margin: 2px 0;
        }
    `;
    document.head.appendChild(style);

    criarParticulas();
});

function comprarAgora() {

    let tituloOriginal = document.querySelector(".product-title").textContent.trim();
    let titulo = tituloOriginal.replace("💻", "(PC)").replace("📱", "(Mobile)");

    const quantidade = parseInt(document.getElementById("quantity").value) || 1;

    const planRadio = document.querySelector('input[name="plan"]:checked');

    if (!planRadio) {
        alert("Selecione uma duração válida.");
        return;
    }

    const precoUnitario = parseFloat(planRadio.getAttribute("data-price"));

    const duracaoSelecionada = planRadio.getAttribute("data-label");

    const total = (precoUnitario * quantidade).toFixed(2);

    const tituloCompletoParaURL = `${titulo} (${duracaoSelecionada})`;

    const nome = prompt("Digite seu nome:");
    if (!nome) {
        alert("O nome é obrigatório.");
        return;
    }

    const email = prompt("Digite seu e-mail:");
    if (!email) { 
        alert("O e-mail é obrigatório."); 
        return; 
    }

    const regexEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!regexEmail.test(email)) {
        alert("Digite um e-mail válido.");
        return;
    }

    const mensagem = 
        `Olá, meu nome é ${nome}.` +
        `\n\nEmail: ${email}` +
        `\nProduto: ${tituloCompletoParaURL}` +
        `\nQuantidade: ${quantidade}` +
        `\nTotal: R$ ${total.replace(".", ",")}`;

    const url = `https://w.app/veltrix?text=${encodeURIComponent(mensagem)}`;

    window.location.href = url;
}

function adicionarAoCarrinho() {

    const titulo = document.querySelector(".product-title")?.textContent.trim() || "Produto";

    const imagem = document.getElementById("productImage")?.getAttribute("src") || "";

    const planSelected = document.querySelector('input[name="plan"]:checked');
    if (!planSelected) {
        console.error("Nenhum plano selecionado!");
        return;
    }

    const price = parseFloat(planSelected.getAttribute("data-price"));
    const duration = planSelected.getAttribute("data-label");

    const quantity = parseInt(document.getElementById("quantity").value) || 1;

    const produto = {
        titulo: `${titulo} ${duration}`,
        preco: `R$ ${price.toFixed(2).replace('.', ',')}`,
        duracao: duration,
        imagem: imagem,
        quantidade: quantity
    };

    carrinhoManager.adicionarProduto(produto);
}

<script>
// Assets/JS/spiderweb.js
class SpiderWeb {
    constructor() {
        this.canvas = null;
        this.ctx = null;
        this.particles = [];
        this.mouse = { x: null, y: null };
        this.maxDistance = 180;
        this.particleCount = Math.floor((window.innerWidth * window.innerHeight) / 15000);
        this.hue = 200;
        this.init();
    }

    init() {
        this.createCanvas();
        this.createParticles();
        this.bindEvents();
        this.animate();
    }

    createCanvas() {
        this.canvas = document.createElement('canvas');
        this.ctx = this.canvas.getContext('2d');
        Object.assign(this.canvas.style, {
            position: 'fixed',
            top: '0',
            left: '0',
            width: '100%',
            height: '100%',
            zIndex: '-1',
            pointerEvents: 'none'
        });
        (document.getElementById('particles') || document.body).appendChild(this.canvas);
        this.resize();
    }

    createParticles() {
        this.particles = Array.from({ length: this.particleCount }, () => ({
            x: Math.random() * this.canvas.width,
            y: Math.random() * this.canvas.height,
            vx: (Math.random() - 0.5) * 0.7,
            vy: (Math.random() - 0.5) * 0.7,
            radius: Math.random() * 1.5 + 0.5,
            pulse: Math.random() * Math.PI * 2
        }));
    }

    bindEvents() {
        window.addEventListener('resize', () => this.resize());
        document.addEventListener('mousemove', e => {
            this.mouse.x = e.clientX;
            this.mouse.y = e.clientY;
        });
        document.addEventListener('mouseleave', () => {
            this.mouse.x = null;
            this.mouse.y = null;
        });
    }

    resize() {
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight;
        this.particleCount = Math.floor((window.innerWidth * window.innerHeight) / 15000);
        this.createParticles();
    }

    drawParticle(p) {
        p.pulse += 0.05;
        const brightness = 0.6 + Math.sin(p.pulse) * 0.4;
        const gradient = this.ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.radius * 6);
        gradient.addColorStop(0, `hsla(${this.hue}, 100%, ${70 * brightness}%, 0.9)`);
        gradient.addColorStop(1, `hsla(${this.hue}, 100%, 30%, 0)`);
        this.ctx.beginPath();
        this.ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        this.ctx.fillStyle = gradient;
        this.ctx.fill();
    }

    updateParticles() {
        for (let p of this.particles) {
            p.x += p.vx;
            p.y += p.vy;

            if (p.x < 0 || p.x > this.canvas.width) p.vx *= -1;
            if (p.y < 0 || p.y > this.canvas.height) p.vy *= -1;

            if (this.mouse.x && this.mouse.y) {
                const dx = this.mouse.x - p.x;
                const dy = this.mouse.y - p.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < this.maxDistance) {
                    const force = (this.maxDistance - dist) / this.maxDistance;
                    p.vx += dx * force * 0.0006;
                    p.vy += dy * force * 0.0006;
                }
            }

            p.vx *= 0.985;
            p.vy *= 0.985;
        }
    }

    animate() {
        this.ctx.fillStyle = "rgba(0, 0, 0, 0.25)";
        this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
        this.updateParticles();
        this.particles.forEach(p => this.drawParticle(p));
        this.hue = (this.hue + 0.3) % 360;
        requestAnimationFrame(() => this.animate());
    }
}

document.addEventListener('DOMContentLoaded', () => new SpiderWeb());

</script>
