.sidebar {
    position: fixed;
    top: 0;
    left: -300px;
    width: 300px;
    height: 100vh;
    background: linear-gradient(180deg, #0a0a0a 0%, #111111 100%);
    backdrop-filter: blur(10px);
    transition: left 0.3s ease;
    z-index: 999;
    border-right: 1px solid rgba(179, 0, 255, 0.3);
    box-shadow: 5px 0 20px rgba(0, 0, 0, 0.5);
}

.sidebar.active {
    left: 0;
}

.sidebar nav {
    display: flex;
    flex-direction: column;
    padding: 80px 20px 20px;
    height: 100%;
    overflow-y: auto;
}

.sidebar a {
    color: rgba(255, 255, 255, 0.8);
    padding: 15px 20px;
    text-decoration: none;
    transition: all 0.3s ease;
    margin: 5px 0;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 12px;
    position: relative;
    overflow: hidden;
}

.sidebar a::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 3px;
    background: linear-gradient(180deg, #b300ff, #9900cc);
    transform: scaleY(0);
    transition: transform 0.3s ease;
}

.sidebar a:hover {
    color: #b300ff;
    background: rgba(179, 0, 255, 0.1);
    transform: translateX(5px);
}

.sidebar a:hover::before {
    transform: scaleY(1);
}

.sidebar a i {
    font-size: 1.1rem;
    width: 20px;
    text-align: center;
}

.close-sidebar {
    position: absolute;
    top: 15px;
    right: 15px;
    color: rgba(255, 255, 255, 0.7);
    font-size: 1.5rem;
    cursor: pointer;
    padding: 8px;
    border-radius: 50%;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
}

.close-sidebar:hover {
    color: #b300ff;
    background: rgba(179, 0, 255, 0.1);
    transform: rotate(90deg);
}

.sidebar-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.5);
    z-index: 998;
    opacity: 0;
    visibility: hidden;
    transition: all 0.3s ease;
}

.sidebar-overlay.active {
    opacity: 1;
    visibility: visible;
}

@media (max-width: 480px) {
    .sidebar {
        width: 280px;
        left: -280px;
    }
    
    .sidebar nav {
        padding: 70px 15px 15px;
    }
    
    .sidebar a {
        padding: 12px 15px;
        font-size: 0.9rem;
    }
}



/* === VELTRIX TOPO PREMIUM === */
:root{
  --veltrix-purple:#b300ff;
  --veltrix-purple2:#7900ff;
  --veltrix-bg:#050007;
}
header{
  min-height:74px !important;
  height:74px !important;
  padding:8px 18px !important;
  background:linear-gradient(90deg, rgba(5,0,8,.98), rgba(23,0,34,.98), rgba(5,0,8,.98)) !important;
  border-bottom:1px solid rgba(179,0,255,.75) !important;
  box-shadow:0 0 24px rgba(179,0,255,.45), inset 0 -1px 0 rgba(255,255,255,.08) !important;
  backdrop-filter:blur(12px) !important;
}
header::before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:radial-gradient(circle at 50% 0%, rgba(179,0,255,.35), transparent 45%);
}
.menu-toggle{
  width:56px !important;
  height:56px !important;
  border-radius:16px !important;
  background:linear-gradient(135deg,#cc00ff,#7900ff) !important;
  color:white !important;
  box-shadow:0 0 18px rgba(179,0,255,.65) !important;
  font-size:1.45rem !important;
}
.logo{
  position:absolute !important;
  left:50% !important;
  top:50% !important;
  transform:translate(-50%,-50%) !important;
  display:flex !important;
  align-items:center !important;
  justify-content:center !important;
  gap:12px !important;
  white-space:nowrap !important;
}
.logo img{
  width:54px !important;
  height:54px !important;
  border-radius:10px !important;
  object-fit:cover !important;
  filter:drop-shadow(0 0 8px #b300ff) drop-shadow(0 0 18px rgba(179,0,255,.85)) !important;
}
.logo-text{
  font-family:'Montserrat', sans-serif !important;
  font-size:1.65rem !important;
  font-weight:900 !important;
  letter-spacing:3px !important;
  text-transform:uppercase !important;
  color:#e9c8ff !important;
  text-shadow:0 0 8px #b300ff, 0 0 18px #b300ff, 0 0 28px #7900ff !important;
}
.logo-text::after{
  content:' STORE';
  font-size:.65rem;
  margin-left:8px;
  letter-spacing:2px;
  color:#ffffff;
  opacity:.85;
}
.cart-icon{
  width:56px !important;
  height:56px !important;
  display:flex !important;
  align-items:center !important;
  justify-content:center !important;
  border-radius:16px !important;
  background:rgba(255,255,255,.09) !important;
  border:1px solid rgba(179,0,255,.35) !important;
  box-shadow:0 0 15px rgba(179,0,255,.35) !important;
  font-size:1.55rem !important;
}
#cart-count{
  top:-5px !important;
  right:-5px !important;
  background:linear-gradient(135deg,#ff0066,#b300ff) !important;
}
.container, main{
  margin-top:88px !important;
}
@media(max-width:480px){
  header{height:68px !important; min-height:68px !important; padding:7px 14px !important;}
  .menu-toggle,.cart-icon{width:50px !important;height:50px !important;border-radius:14px !important;}
  .logo img{width:44px !important;height:44px !important;}
  .logo-text{font-size:1.32rem !important;letter-spacing:2px !important;}
  .logo-text::after{display:none;}
  .container, main{margin-top:82px !important;}
}

.container {
    max-width: 1400px;
    margin: 60px auto 0;
    padding: 20px;
    flex: 1;
}

.page-title {
    text-align: center;
    margin: 20px 0 30px;
    color: var(--text-color);
    font-size: 2.2rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 2px;
    position: relative;
    padding-bottom: 15px;
}

.page-title::after {
    content: "";
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100px;
    height: 3px;
    background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
    border-radius: 2px;
}

.search-container {
    margin: 20px 0 30px;
    text-align: center;
    position: relative;
}

.search-input {
    padding: 15px 25px;
    width: 100%;
    max-width: 600px;
    border: 1px solid var(--primary-color);
    border-radius: 6px;
    font-size: 1rem;
    background: var(--card-bg);
    color: var(--text-color);
    outline: none;
    transition: all 0.3s ease;
}

.search-input:focus {
    border-color: var(--secondary-color);
    box-shadow: 0 0 10px var(--shadow-color);
}

.search-input::placeholder {
    color: var(--text-secondary);
}

.instruction-button {
    display: block;
    width: 100%;
    max-width: 600px;
    margin: 0 auto 30px;
    padding: 15px 25px;
    background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
    color: var(--dark-bg);
    text-align: center;
    text-decoration: none;
    border-radius: 50px;
    font-weight: 600;
    font-size: 1.1rem;
    transition: all 0.3s ease;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.instruction-button:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 25px var(--shadow-color);
}

.mod-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
    padding: 20px 0;
}





.mod-card {
    background: rgba(17, 17, 17, 0.8);
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    flex-direction: column;
    border: 1px solid var(--primary-color);
    position: relative;
}

.mod-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
}

.mod-thumbnail {
    width: 100%;
    height: auto;
    aspect-ratio: 16 / 9;
    object-fit: cover;
    transition: transform 0.3s ease;
}

.mod-card:hover .mod-thumbnail {
    transform: scale(1.03);
}

.mod-info {
    padding: 15px;
    display: flex;
    flex-direction: column;
    flex-grow: 1;
}

.mod-title {
    color: var(--text-color);
    font-size: 0.9rem;
    margin-bottom: 10px;
    min-height: 2.5em;
    line-height: 1.3;
    font-weight: 400;
}

.mod-info p {
    color: var(--text-secondary);
    font-size: 0.7rem;
    margin-bottom: 5px;
}

.mod-buttons {
    display: flex;
    flex-direction: row;
    gap: 8px;
    margin-top: auto;
    justify-content: space-between;
    align-items: stretch;
}

.mod-button {
    background: var(--primary-color);
    color: var(--dark-bg);
    border: none;
    padding: 8px 12px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.3s ease;
    font-size: 0.75rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex-shrink: 0;
    text-decoration: none;
    text-align: center;
}

.mod-button:hover {
    background: var(--secondary-color);
}

.mod-button.download-button {
    background: transparent;
    color: var(--primary-color);
    border: 1px solid var(--primary-color);
}

.mod-button.download-button:hover {
    background: var(--primary-color);
    color: var(--dark-bg);
}

.mod-button.download-button.disabled {
    background: #666;
    color: #999;
    border: 1px solid #666;
    cursor: not-allowed;
    opacity: 0.6;
}

.mod-button.download-button.disabled:hover {
    background: #666;
    color: #999;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.mod-card {
    animation: fadeIn 0.5s ease forwards;
}

.mod-card:nth-child(1) { animation-delay: 0.1s; }
.mod-card:nth-child(2) { animation-delay: 0.2s; }
.mod-card:nth-child(3) { animation-delay: 0.3s; }
.mod-card:nth-child(4) { animation-delay: 0.4s; }
.mod-card:nth-child(5) { animation-delay: 0.5s; }

@media (max-width: 480px) {
    .container {
        margin-top: 55px;
        padding: 15px;
    }
    
    .page-title {
        font-size: 1.8rem;
    }
    
    .mod-list {
        grid-template-columns: repeat(2, 1fr);
        gap: 15px;
    }
    
    .search-input {
        padding: 12px 20px;
        font-size: 0.9rem;
    }
    
    .instruction-button {
        padding: 12px 20px;
        font-size: 1rem;
    }
}

@media (min-width: 481px) and (max-width: 768px) {
    .mod-list {
        grid-template-columns: repeat(3, 1fr);
        gap: 18px;
    }
}

@media (min-width: 769px) and (max-width: 1024px) {
    .mod-list {
        grid-template-columns: repeat(3, 1fr);
    }
}

@media (min-width: 1025px) {
    .mod-list {
        grid-template-columns: repeat(4, 1fr);
    }
}

@media (min-width: 1400px) {
    .mod-list {
        grid-template-columns: repeat(5, 1fr);
    }
}

async function loadMods() {
    try {
        const data = {"mods": [{"title": "Cleo Trollar Veículo", "video_id": "afwkY3h_i6o", "download_url": "https://mineurl.com/trollveiculo", "creditos": "VELTRIX", "game": "GTA SAM-MP", "senha": "Nenhuma", "plataforma": "Mobile", "ativacao": "Basta Aperta pra Entrar no Veículo", "instalacao": "Copiar para a pasta Cleo"}, {"title": "Cleo Auto Cinto", "video_id": "dEvEy9QcLSw", "download_url": "https://mineurl.com/cleoautocinto", "creditos": "VELTRIX", "game": "GTA SAM-MP", "senha": "Nenhuma", "plataforma": "PC", "ativacao": "Basta Entrar em um Veiculo", "instalacao": "Copiar para a pasta Cleo"}]};
        renderMods(data.mods);
    } catch (error) {
        console.error("Erro ao carregar os mods:", error);
    }
}

function renderMods(mods) {
    const modList = document.getElementById("modList");
    modList.innerHTML = "";

    mods.forEach(mod => {
        const downloadLink = mod.download_url ? mod.download_url : 'javascript:void(0)';
        const downloadText = mod.download_url ? '' : '';
        const downloadClass = mod.download_url ? 'download-button' : 'download-button disabled';
        const downloadTarget = mod.download_url ? 'target="_blank"' : '';

        const modCard = document.createElement("div");
        modCard.className = "mod-card";
        modCard.innerHTML = `
            <img class="mod-thumbnail" src="https://img.youtube.com/vi/${mod.video_id}/hqdefault.jpg" alt="Thumbnail do vídeo">
            <div class="mod-info">
                <h3 class="mod-title">${mod.title}</h3>
                <p>👤 Créditos: ${mod.creditos}</p>
                <p>🎮 Game: ${mod.game}</p>
                <p>🔑 Senha: ${mod.senha}</p>
                <p>🚀 Plataforma: ${mod.plataforma}</p>
                <p>🧩 Ativação: ${mod.ativacao}</p>
                <p>⏬ Instalação: ${mod.instalacao}</p>
                <div class="mod-buttons">
                    <a href="https://www.youtube.com/watch?v=${mod.video_id}" class="mod-button video-button" target="_blank">
                        <i class="bi bi-youtube"></i> Vídeo
                    </a>
                    <a href="${downloadLink}" class="mod-button ${downloadClass}" ${downloadTarget}>
                        <i class="bi bi-download"></i> ${downloadText}
                    </a>
                </div>
            </div>
        `;
        modList.appendChild(modCard);
    });
}

function filterMods() {
    const query = document.getElementById("searchInput").value.toLowerCase();
    const mods = document.querySelectorAll(".mod-card");

    mods.forEach(mod => {
        const title = mod.querySelector(".mod-title").textContent.toLowerCase();
        if (title.includes(query)) {
            mod.style.display = "block";
        } else {
            mod.style.display = "none";
        }
    });
}

document.getElementById("searchInput").addEventListener("input", function() {
    if (this.value === "") {
        const mods = document.querySelectorAll(".mod-card");
        mods.forEach(mod => {
            mod.style.display = "block";
        });
    } else {
        filterMods();
    }
});

document.addEventListener("DOMContentLoaded", loadMods);
</script>

    closeSidebar.addEventListener('click', function() {
        sidebar.classList.remove('active');
    });
    
    document.addEventListener('click', function(e) {
        if (sidebar.classList.contains('active') && !sidebar.contains(e.target) && e.target !== menuToggle) {
            sidebar.classList.remove('active');
        }
    });
});
</script>
<script>
// Assets/JS/spiderweb.js
class SpiderWeb {
    constructor() {
        this.canvas = null;
        this.ctx = null;
        this.particles = [];
        this.mouse = { x: null, y: null };
        this.maxDistance = 180;
        this.particleCount = Math.floor((window.innerWidth * window.innerHeight) / 15000);
        this.hue = 200;
        this.init();
    }

    init() {
        this.createCanvas();
        this.createParticles();
        this.bindEvents();
        this.animate();
    }

    createCanvas() {
        this.canvas = document.createElement('canvas');
        this.ctx = this.canvas.getContext('2d');
        Object.assign(this.canvas.style, {
            position: 'fixed',
            top: '0',
            left: '0',
            width: '100%',
            height: '100%',
            zIndex: '-1',
            pointerEvents: 'none'
        });
        (document.getElementById('particles') || document.body).appendChild(this.canvas);
        this.resize();
    }

    createParticles() {
        this.particles = Array.from({ length: this.particleCount }, () => ({
            x: Math.random() * this.canvas.width,
            y: Math.random() * this.canvas.height,
            vx: (Math.random() - 0.5) * 0.7,
            vy: (Math.random() - 0.5) * 0.7,
            radius: Math.random() * 1.5 + 0.5,
            pulse: Math.random() * Math.PI * 2
        }));
    }

    bindEvents() {
        window.addEventListener('resize', () => this.resize());
        document.addEventListener('mousemove', e => {
            this.mouse.x = e.clientX;
            this.mouse.y = e.clientY;
        });
        document.addEventListener('mouseleave', () => {
            this.mouse.x = null;
            this.mouse.y = null;
        });
    }

    resize() {
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight;
        this.particleCount = Math.floor((window.innerWidth * window.innerHeight) / 15000);
        this.createParticles();
    }

    drawParticle(p) {
        p.pulse += 0.05;
        const brightness = 0.6 + Math.sin(p.pulse) * 0.4;
        const gradient = this.ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.radius * 6);
        gradient.addColorStop(0, `hsla(${this.hue}, 100%, ${70 * brightness}%, 0.9)`);
        gradient.addColorStop(1, `hsla(${this.hue}, 100%, 30%, 0)`);
        this.ctx.beginPath();
        this.ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        this.ctx.fillStyle = gradient;
        this.ctx.fill();
    }

    updateParticles() {
        for (let p of this.particles) {
            p.x += p.vx;
            p.y += p.vy;

            if (p.x < 0 || p.x > this.canvas.width) p.vx *= -1;
            if (p.y < 0 || p.y > this.canvas.height) p.vy *= -1;

            if (this.mouse.x && this.mouse.y) {
                const dx = this.mouse.x - p.x;
                const dy = this.mouse.y - p.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < this.maxDistance) {
                    const force = (this.maxDistance - dist) / this.maxDistance;
                    p.vx += dx * force * 0.0006;
                    p.vy += dy * force * 0.0006;
                }
            }

            p.vx *= 0.985;
            p.vy *= 0.985;
        }
    }

    animate() {
        this.ctx.fillStyle = "rgba(0, 0, 0, 0.25)";
        this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
        this.updateParticles();
        this.particles.forEach(p => this.drawParticle(p));
        this.hue = (this.hue + 0.3) % 360;
        requestAnimationFrame(() => this.animate());
    }
}

document.addEventListener('DOMContentLoaded', () => new SpiderWeb());

</script>
